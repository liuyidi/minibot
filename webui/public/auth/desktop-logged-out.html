<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>已退出 · Minibot</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #fff;
        color: #080808;
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      main {
        max-width: 360px;
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 22px;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: #666;
        font-size: 14px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>已退出登录</h1>
      <p>可以关闭此浏览器标签，回到 Minibot 窗口。</p>
    </main>
    <script>
      window.setTimeout(function () {
        try {
          window.close();
        } catch (_) {}
      }, 800);
    </script>
  </body>
</html>
