[[permission]]
identifier = "allow-host"
description = "Allow minibot desktop host bridge commands from the WebUI"
commands.allow = [
  "connect_server",
  "get_server_info",
  "set_api_base",
  "open_in_browser",
  "host_get_runtime_info",
  "host_reconnect",
  "host_pick_folder",
  "host_open_logs",
  "host_export_diagnostics",
  "host_set_native_chrome_sidebar_open",
  "host_set_native_chrome_dark",
]
