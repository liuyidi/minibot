[package]
name = "minibot-desktop"
version = "0.1.0"
description = "Tauri thin shell for minibot WebUI"
authors = ["minibot"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "minibot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
