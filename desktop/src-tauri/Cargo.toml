[package]
name = "nanobot-desktop"
version = "0.1.0"
description = "Tauri engine host for nanobot WebUI"
authors = ["nanobot"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "nanobot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
url = "2"
dirs = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
