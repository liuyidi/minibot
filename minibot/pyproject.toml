[project]
name = "minibot"
version = "1.0.23"
description = "FastAPI agent runtime (minibot)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "mcp>=1.26.0,<2.0.0",
    "mini-langfuse-sdk @ git+https://github.com/liuyidi/mini-langfuse.git@main#subdirectory=sdk-python",
    "croniter>=2.0.0,<7.0.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.12.0",
    "pyyaml>=6.0",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
e2b = ["e2b>=1.0.0"]
feishu = ["lark-oapi>=1.5.0,<2.0.0"]
weixin = ["qrcode[pil]>=8.0"]

[project.scripts]
minibot = "minibot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/minibot"]
# Do NOT force-include static/skills — they already live under src/minibot and
# hatch would add them twice (ValueError: same path in wheel).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
markers = [
    "perf: performance smoke tests (coarse CI budgets)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9"]
ignore = ["F811"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]
