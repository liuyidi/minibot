name: Publish npm packages

# Publishes @liuyidi/minibot-client then @liuyidi/minibot via npm Trusted Publishing (OIDC).
# No NPM_TOKEN required for publish. Configure Trusted Publisher on each package at npmjs.com.
# Requires: Node >= 22.14, npm CLI >= 11.5.1

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/minibot-client
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          scope: "@liuyidi"
          package-manager-cache: false
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest
      - name: Install & test
        run: |
          npm install
          npm run build
          npm test
      - name: Publish @liuyidi/minibot-client
        run: npm publish --access public

  publish-cli:
    needs: publish-client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          scope: "@liuyidi"
          package-manager-cache: false
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest
      - name: Install workspace deps
        run: npm install
      - name: Build & test CLI
        working-directory: packages/minibot-cli
        run: |
          npm run build
          npm test
      - name: Publish @liuyidi/minibot
        working-directory: packages/minibot-cli
        run: npm publish --access public
