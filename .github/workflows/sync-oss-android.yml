name: Sync Android APK to OSS

# Download a public APK (typically an EAS production-apk artifact) and update
# minibot/android/… plus releases.json on Aliyun OSS. The WebUI download page
# reads the OSS manifest and does not need a WebUI rebuild.

on:
  workflow_dispatch:
    inputs:
      version:
        description: App version (e.g. 1.0.7)
        required: true
        type: string
      apk_url:
        description: HTTPS URL of the APK (EAS artifact URL)
        required: true
        type: string

concurrency:
  group: sync-oss-android
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-oss:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OSS_BUCKET: ${{ vars.OSS_BUCKET }}
      OSS_REGION: ${{ vars.OSS_REGION }}
      OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
      OSS_PUBLIC_BASE_URL: ${{ vars.OSS_PUBLIC_BASE_URL }}
      OSS_PREFIX: ${{ vars.OSS_PREFIX || 'minibot' }}
      OSS_OBJECT_ACL: ${{ vars.OSS_OBJECT_ACL || 'public-read' }}
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Validate OSS configuration
        run: |
          missing=0
          for name in OSS_BUCKET OSS_REGION OSS_ENDPOINT OSS_PUBLIC_BASE_URL OSS_ACCESS_KEY_ID OSS_ACCESS_KEY_SECRET; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret/variable: $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Install ossutil
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip
          curl -fsSL -o /tmp/ossutil.zip \
            "https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil-v1.7.19-linux-amd64.zip"
          unzip -qo /tmp/ossutil.zip -d /tmp/ossutil
          bin="$(find /tmp/ossutil -type f \( -name 'ossutil64' -o -name 'ossutil' \) | head -n1)"
          sudo install -m 755 "$bin" /usr/local/bin/ossutil
          ossutil --version
          ossutil config \
            -e "$OSS_ENDPOINT" \
            -i "$OSS_ACCESS_KEY_ID" \
            -k "$OSS_ACCESS_KEY_SECRET" \
            -L CH \
            --config-file "$HOME/.ossutilconfig"
        env:
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}

      - name: Download APK and publish
        run: |
          set -euo pipefail
          chmod +x scripts/publish-oss-releases.sh
          mkdir -p /tmp/minibot-apk
          curl -fsSL -o /tmp/minibot-apk/minibot.apk "${{ inputs.apk_url }}"
          file /tmp/minibot-apk/minibot.apk
          scripts/publish-oss-releases.sh --version "${{ inputs.version }}" --android /tmp/minibot-apk/minibot.apk
