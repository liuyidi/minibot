name: Sync Desktop Release to OSS

# After a desktop-v* GitHub Release is published (not draft), download installers
# and sync macOS / Windows / Linux packages + releases.json to Aliyun OSS.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. desktop-v1.0.0-beta.1)
        required: true
        type: string

concurrency:
  group: sync-oss-desktop-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync-oss:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'desktop-v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OSS_BUCKET: ${{ vars.OSS_BUCKET }}
      OSS_REGION: ${{ vars.OSS_REGION }}
      OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
      OSS_PUBLIC_BASE_URL: ${{ vars.OSS_PUBLIC_BASE_URL }}
      OSS_PREFIX: ${{ vars.OSS_PREFIX || 'minibot' }}
      OSS_OBJECT_ACL: ${{ vars.OSS_OBJECT_ACL || 'public-read' }}
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate OSS configuration
        run: |
          missing=0
          for name in OSS_BUCKET OSS_REGION OSS_ENDPOINT OSS_PUBLIC_BASE_URL OSS_ACCESS_KEY_ID OSS_ACCESS_KEY_SECRET; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret/variable: $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ossutil
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip
          curl -fsSL -o /tmp/ossutil.zip \
            "https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil-v1.7.19-linux-amd64.zip"
          unzip -qo /tmp/ossutil.zip -d /tmp/ossutil
          bin="$(find /tmp/ossutil -type f \( -name 'ossutil64' -o -name 'ossutil' \) | head -n1)"
          sudo install -m 755 "$bin" /usr/local/bin/ossutil
          ossutil --version
          ossutil config \
            -e "$OSS_ENDPOINT" \
            -i "$OSS_ACCESS_KEY_ID" \
            -k "$OSS_ACCESS_KEY_SECRET" \
            -L CH \
            --config-file "$HOME/.ossutilconfig"
        env:
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}

      - name: Sync release assets to OSS
        run: |
          chmod +x scripts/sync-desktop-release-to-oss.sh scripts/publish-oss-releases.sh
          scripts/sync-desktop-release-to-oss.sh --tag "${{ steps.tag.outputs.value }}"
