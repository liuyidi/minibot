name: Sync Desktop Release to OSS

# After a desktop-v* GitHub Release is published (not draft), download installers
# and sync macOS / Windows / Linux packages + releases.json to Aliyun OSS.

on:
  workflow_run:
    workflows: ["Publish Desktop"]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. desktop-v1.0.0-beta.2)
        required: true
        type: string

concurrency:
  group: sync-oss-desktop-${{ github.event.workflow_run.head_sha || github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync-oss:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'desktop-v')) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.name == 'Publish Desktop')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OSS_BUCKET: ${{ vars.OSS_BUCKET }}
      OSS_REGION: ${{ vars.OSS_REGION }}
      OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
      OSS_PUBLIC_BASE_URL: ${{ vars.OSS_PUBLIC_BASE_URL }}
      OSS_PREFIX: ${{ vars.OSS_PREFIX || 'minibot' }}
      OSS_OBJECT_ACL: ${{ vars.OSS_OBJECT_ACL || 'public-read' }}
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            echo "value=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=__from_package_json__" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.release.tag_name || inputs.tag || github.ref }}

      - name: Validate OSS configuration
        run: |
          missing=0
          for name in OSS_BUCKET OSS_REGION OSS_ENDPOINT OSS_PUBLIC_BASE_URL OSS_ACCESS_KEY_ID OSS_ACCESS_KEY_SECRET; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret/variable: $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ossutil
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip
          curl -fsSL -o /tmp/ossutil.zip \
            "https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil-v1.7.19-linux-amd64.zip"
          unzip -qo /tmp/ossutil.zip -d /tmp/ossutil
          bin="$(find /tmp/ossutil -type f \( -name 'ossutil64' -o -name 'ossutil' \) | head -n1)"
          sudo install -m 755 "$bin" /usr/local/bin/ossutil
          ossutil --version
          ossutil config \
            -e "$OSS_ENDPOINT" \
            -i "$OSS_ACCESS_KEY_ID" \
            -k "$OSS_ACCESS_KEY_SECRET" \
            -L CH \
            --config-file "$HOME/.ossutilconfig"
        env:
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}

      - name: Sync release assets to OSS
        run: |
          chmod +x scripts/sync-desktop-release-to-oss.sh scripts/publish-oss-releases.sh
          scripts/sync-desktop-release-to-oss.sh --tag "${{ steps.tag.outputs.value }}"

  notify-feishu:
    needs: sync-oss
    if: ${{ needs.sync-oss.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      FEISHU_RELEASE_WEBHOOK_URL: ${{ secrets.FEISHU_RELEASE_WEBHOOK_URL }}
      OSS_PUBLIC_BASE_URL: ${{ vars.OSS_PUBLIC_BASE_URL }}
      OSS_PREFIX: ${{ vars.OSS_PREFIX || 'minibot' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Send Feishu sync notification
        run: |
          set -euo pipefail

          if [[ -z "${FEISHU_RELEASE_WEBHOOK_URL:-}" ]]; then
            echo "FEISHU_RELEASE_WEBHOOK_URL is not set; skipping Feishu notification."
            exit 0
          fi

          chmod +x scripts/send-feishu-release-notification.sh

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            tag="${{ github.event.release.tag_name }}"
          else
            version="$(node -p "require('./desktop/package.json').version")"
            tag="desktop-v${version}"
          fi
          version="${tag#desktop-v}"
          release_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${tag}"
          workflow_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          manifest_url="${OSS_PUBLIC_BASE_URL%/}/${OSS_PREFIX}/releases.json"

          FEISHU_RELEASE_TITLE="minibot desktop 已同步到 OSS" \
          FEISHU_RELEASE_PHASE="OSS 同步完成" \
          FEISHU_RELEASE_SUBTITLE="v${version} · OSS Sync" \
          FEISHU_RELEASE_SUMMARY="GitHub Release 产物已同步到 OSS，下载清单已更新。" \
          FEISHU_CARD_TEMPLATE="turquoise" \
          MANIFEST_URL="$manifest_url" \
          RELEASE_VERSION="$version" \
          RELEASE_URL="$release_url" \
          WORKFLOW_URL="$workflow_url" \
          scripts/send-feishu-release-notification.sh
