name: Publish @liuyidi/minibot-client

# GitHub Packages scope must match the repo owner (liuyidi).
# Apps keep import alias `@minibot/client` via npm package alias.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/minibot-client
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: https://npm.pkg.github.com
          scope: "@liuyidi"
      - name: Install & test
        run: |
          npm install
          npm run build
          npm test
      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
