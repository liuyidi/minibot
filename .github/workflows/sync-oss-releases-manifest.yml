name: Sync Releases Manifest to OSS

# Upload webui/public/releases.json only (e.g. set ios TestFlight join URL).

on:
  workflow_dispatch:

concurrency:
  group: sync-oss-releases-manifest
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OSS_BUCKET: ${{ vars.OSS_BUCKET }}
      OSS_REGION: ${{ vars.OSS_REGION }}
      OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
      OSS_PUBLIC_BASE_URL: ${{ vars.OSS_PUBLIC_BASE_URL }}
      OSS_PREFIX: ${{ vars.OSS_PREFIX || 'minibot' }}
      OSS_OBJECT_ACL: ${{ vars.OSS_OBJECT_ACL || 'public-read' }}
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}

    steps:
      - uses: actions/checkout@v6

      - name: Validate OSS configuration
        run: |
          missing=0
          for name in OSS_BUCKET OSS_REGION OSS_ENDPOINT OSS_PUBLIC_BASE_URL OSS_ACCESS_KEY_ID OSS_ACCESS_KEY_SECRET; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret/variable: $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Install ossutil
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/ossutil.zip \
            "https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil-v1.7.19-linux-amd64.zip"
          unzip -qo /tmp/ossutil.zip -d /tmp/ossutil
          bin="$(find /tmp/ossutil -type f \( -name 'ossutil64' -o -name 'ossutil' \) | head -n1)"
          sudo install -m 755 "$bin" /usr/local/bin/ossutil
          ossutil --version
          ossutil config \
            -e "$OSS_ENDPOINT" \
            -i "$OSS_ACCESS_KEY_ID" \
            -k "$OSS_ACCESS_KEY_SECRET" \
            --config-file "$HOME/.ossutilconfig"

      - name: Upload releases.json
        run: |
          set -euo pipefail
          manifest="webui/public/releases.json"
          test -f "$manifest"
          python3 -m json.tool "$manifest" >/dev/null
          object="${OSS_PREFIX}/releases.json"
          dest="oss://${OSS_BUCKET}/${object}"
          ossutil cp "$manifest" "$dest" \
            --force \
            --region "$OSS_REGION" \
            --endpoint "$OSS_ENDPOINT" \
            --acl "$OSS_OBJECT_ACL" \
            --meta "Cache-Control:no-cache"
          echo "Published ${OSS_PUBLIC_BASE_URL%/}/${object}"
          curl -fsS "${OSS_PUBLIC_BASE_URL%/}/${object}" | python3 -c 'import json,sys; m=json.load(sys.stdin); print("ios=", m.get("ios"))'
