name: Publish Site (ECS)

# Build the public VitePress site on GitHub Actions, then promote dist on
# Aliyun ECS (liuyidi.me). Does not rebuild minibot / WebUI.
#
# Trigger: push to main touching site/** (or deploy scripts / this workflow),
# or Actions → Run workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "deploy/build-site.sh"
      - "deploy/promote-site.sh"
      - ".github/workflows/publish-site.yml"

concurrency:
  group: aliyun-ecs-demo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-site:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      ECS_HOST: ${{ vars.ECS_HOST || '116.62.35.76' }}
      ECS_USER: ${{ vars.ECS_USER || 'root' }}
      ECS_SSH_PORT: ${{ vars.ECS_SSH_PORT || 22 }}

    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}

    steps:
      - name: Resolve deploy metadata
        id: meta
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site
        working-directory: site
        run: |
          npm ci
          npm run docs:build -- --outDir .vitepress/dist-staging
          node scripts/check-dist.mjs .vitepress/dist-staging

      - name: Pull minibot commit on ECS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.ECS_HOST }}
          username: ${{ env.ECS_USER }}
          key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          port: ${{ env.ECS_SSH_PORT }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            git config --global --add safe.directory /opt/demo/minibot
            cd /opt/demo/minibot
            git fetch origin "${{ github.sha }}"
            git reset --hard "${{ github.sha }}"
            echo "HEAD=$(git rev-parse --short HEAD)"
            git log -1 --oneline
            rm -rf site/.vitepress/dist-staging
            mkdir -p site/.vitepress/dist-staging

      - name: Upload site dist to ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.ECS_HOST }}
          username: ${{ env.ECS_USER }}
          key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          port: ${{ env.ECS_SSH_PORT }}
          source: "site/.vitepress/dist-staging"
          target: "/opt/demo/minibot/site/.vitepress"
          strip_components: 2
          overwrite: true
          rm: true

      - name: Promote site dist on ECS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.ECS_HOST }}
          username: ${{ env.ECS_USER }}
          key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          port: ${{ env.ECS_SSH_PORT }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/demo/minibot
            bash deploy/promote-site.sh
            test -f site/.vitepress/dist/index.html
            test -f site/.vitepress/dist/minibot/download/index.html
            test -f site/.vitepress/dist/minibot/web/index.html
            curl -fsS -o /dev/null -w "local site %{http_code}\n" http://127.0.0.1/

      - name: Verify public site URLs
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.ECS_HOST }}
          username: ${{ env.ECS_USER }}
          key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          port: ${{ env.ECS_SSH_PORT }}
          command_timeout: 2m
          script: |
            set -euo pipefail
            curl -fsS -o /dev/null -w "public site %{http_code}\n" https://liuyidi.me/
            curl -fsS -o /dev/null -w "public minibot %{http_code}\n" https://liuyidi.me/minibot/
            curl -fsS -o /dev/null -w "public download %{http_code}\n" https://liuyidi.me/minibot/download/
            curl -fsS -o /dev/null -w "public web %{http_code}\n" https://liuyidi.me/minibot/web/

  notify-serverlessship:
    needs: publish-site
    if: ${{ needs.publish-site.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SERVERLESSSHIP_RELEASE_URL: ${{ vars.SERVERLESSSHIP_RELEASE_URL }}
      SERVERLESSSHIP_TOKEN: ${{ secrets.SERVERLESSSHIP_TOKEN_MINIBOT || secrets.SERVERLESSSHIP_TOKEN }}

    steps:
      - name: Send deploy notification to ServerlessShip
        run: |
          set -euo pipefail

          if [[ -z "${SERVERLESSSHIP_TOKEN:-}" ]]; then
            echo "Missing SERVERLESSSHIP_TOKEN_MINIBOT (or SERVERLESSSHIP_TOKEN) secret." >&2
            exit 1
          fi

          serverlessship_release_url="${SERVERLESSSHIP_RELEASE_URL:-https://serverless-ship.liuyidi.me/api/releases}"

          payload="$(node -e 'process.stdout.write(JSON.stringify({
            project: "minibot-site",
            version: process.env.RELEASE_VERSION,
            tag: process.env.RELEASE_SHA,
            repository: process.env.GITHUB_REPOSITORY,
            releaseUrl: process.env.RELEASE_URL,
            workflowUrl: process.env.WORKFLOW_URL,
            channel: "Site",
          }));')"

          response="$(
            curl -fsS \
              -X POST \
              -H "Authorization: Bearer ${SERVERLESSSHIP_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "$serverlessship_release_url"
          )"

          echo "$response"
        env:
          RELEASE_VERSION: ${{ needs.publish-site.outputs.short_sha }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_URL: https://liuyidi.me/
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
