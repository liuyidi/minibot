name: Publish WebUI (ECS)

# Build the React WebUI on GitHub Actions, sync hashed assets to OSS/CDN
# (downloads.liuyidi.me/minibot/webui/), then promote dist on Aliyun ECS
# (HTML + fallback assets at bot.liuyidi.me). Does not rebuild the Python
# server image — use Publish Server (ECS) for that.
#
# Trigger: push to main touching webui/** (or promote script / this workflow),
# or Actions → Run workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "webui/**"
      - "deploy/promote-webui.sh"
      - "scripts/publish-oss-webui-assets.sh"
      - "scripts/publish-oss-katex-vendor.sh"
      - "scripts/publish-oss-syntax-vendor.sh"
      - ".github/workflows/publish-webui.yml"

concurrency:
  group: aliyun-ecs-demo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-webui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      ECS_HOST: ${{ vars.ECS_HOST || '116.62.35.76' }}
      ECS_USER: ${{ vars.ECS_USER || 'root' }}
      ECS_SSH_PORT: ${{ vars.ECS_SSH_PORT || 22 }}
      OSS_BUCKET: ${{ vars.OSS_BUCKET }}
      OSS_REGION: ${{ vars.OSS_REGION }}
      OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
      OSS_PUBLIC_BASE_URL: ${{ vars.OSS_PUBLIC_BASE_URL }}
      OSS_PREFIX: ${{ vars.OSS_PREFIX || 'minibot' }}
      OSS_OBJECT_ACL: ${{ vars.OSS_OBJECT_ACL || 'public-read' }}
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      # Set per-build in "Resolve CDN base" (versioned path + pre-gzip on OSS).

    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}

    steps:
      - name: Resolve deploy metadata
        id: meta
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve CDN base
        id: cdn
        run: |
          version="$(node -p "require('./webui/package.json').version")"
          base="https://downloads.liuyidi.me/minibot/webui/${version}/"
          path="minibot/webui/${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "asset_base=${base}" >> "$GITHUB_OUTPUT"
          echo "cdn_path=${path}" >> "$GITHUB_OUTPUT"
          echo "VITE_ASSET_BASE=${base}" >> "$GITHUB_ENV"
          echo "WEBUI_CDN_PATH=${path}" >> "$GITHUB_ENV"
          echo "CDN base ${base}"

      - name: Check OSS credentials
        run: |
          missing=0
          for name in OSS_BUCKET OSS_REGION OSS_ENDPOINT OSS_PUBLIC_BASE_URL OSS_ACCESS_KEY_ID OSS_ACCESS_KEY_SECRET; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret/variable: $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install WebUI deps
        working-directory: webui
        run: npm ci

      - name: Install ossutil
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip
          curl -fsSL -o /tmp/ossutil.zip \
            "https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil-v1.7.19-linux-amd64.zip"
          unzip -qo /tmp/ossutil.zip -d /tmp/ossutil
          bin="$(find /tmp/ossutil -type f \( -name 'ossutil64' -o -name 'ossutil' \) | head -n1)"
          sudo install -m 755 "$bin" /usr/local/bin/ossutil
          ossutil --version
          ossutil config \
            -e "$OSS_ENDPOINT" \
            -i "$OSS_ACCESS_KEY_ID" \
            -k "$OSS_ACCESS_KEY_SECRET" \
            -L CH \
            --config-file "$HOME/.ossutilconfig"

      - name: Publish KaTeX vendor (version-pinned)
        id: katex
        run: |
          chmod +x scripts/publish-oss-katex-vendor.sh
          out="$(scripts/publish-oss-katex-vendor.sh)"
          printf '%s\n' "$out"
          vendor="$(printf '%s\n' "$out" | sed -n 's/^VITE_KATEX_VENDOR_BASE=//p' | tail -1)"
          test -n "$vendor"
          echo "vendor_base=${vendor}" >> "$GITHUB_OUTPUT"
          echo "VITE_KATEX_VENDOR_BASE=${vendor}" >> "$GITHUB_ENV"

      - name: Publish syntax-highlight vendor (version-pinned)
        id: syntax
        run: |
          chmod +x scripts/publish-oss-syntax-vendor.sh
          out="$(scripts/publish-oss-syntax-vendor.sh)"
          printf '%s\n' "$out"
          vendor="$(printf '%s\n' "$out" | sed -n 's/^VITE_SYNTAX_VENDOR_BASE=//p' | tail -1)"
          test -n "$vendor"
          echo "vendor_base=${vendor}" >> "$GITHUB_OUTPUT"
          echo "VITE_SYNTAX_VENDOR_BASE=${vendor}" >> "$GITHUB_ENV"

      - name: Build WebUI
        working-directory: webui
        env:
          VITE_MINIBOT_RELEASES_URL: https://downloads.liuyidi.me/minibot/releases.json
          VITE_PORTAL_DOWNLOAD: https://liuyidi.me/minibot/download/
          VITE_ASSET_BASE: ${{ env.VITE_ASSET_BASE }}
          VITE_KATEX_VENDOR_BASE: ${{ env.VITE_KATEX_VENDOR_BASE }}
          VITE_SYNTAX_VENDOR_BASE: ${{ env.VITE_SYNTAX_VENDOR_BASE }}
        run: |
          npm run build
          test -f dist/index.html
          grep -F "downloads.liuyidi.me/minibot/webui/${{ steps.cdn.outputs.version }}/" dist/index.html
          grep -F 'webui/vendor/katex/' dist/index.html
          # KaTeX must not be re-bundled into app assets when vendor CDN is on.
          if ls dist/assets/katex-*.js >/dev/null 2>&1; then
            echo "FAIL: katex chunk still present in dist/assets" >&2
            ls dist/assets/katex-* >&2 || true
            exit 1
          fi
          # Syntax langs / highlighter must live on the vendor CDN, not per-app assets.
          if ls dist/assets/syntax-highlight-*.js >/dev/null 2>&1; then
            echo "FAIL: syntax-highlight chunk still present in dist/assets" >&2
            ls dist/assets/syntax-highlight-* >&2 || true
            exit 1
          fi
          if ls dist/assets/typescript-*.js dist/assets/python-*.js >/dev/null 2>&1; then
            echo "FAIL: language grammar chunks still present in dist/assets" >&2
            ls dist/assets/typescript-* dist/assets/python-* >&2 || true
            exit 1
          fi
          grep -R -F 'webui/vendor/syntax-highlight/' dist/assets/*.js

      - name: Sync WebUI assets to OSS/CDN
        run: |
          chmod +x scripts/publish-oss-webui-assets.sh
          scripts/publish-oss-webui-assets.sh --dist webui/dist --cdn-path "${{ steps.cdn.outputs.cdn_path }}"

      - name: Stage dist for upload
        run: |
          rm -rf deploy/webui-dist-staging
          mkdir -p deploy/webui-dist-staging
          cp -a webui/dist/. deploy/webui-dist-staging/

      - name: Pull minibot commit on ECS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.ECS_HOST }}
          username: ${{ env.ECS_USER }}
          key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          port: ${{ env.ECS_SSH_PORT }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            git config --global --add safe.directory /opt/demo/minibot
            cd /opt/demo/minibot
            git fetch origin "${{ github.sha }}"
            git reset --hard "${{ github.sha }}"
            echo "HEAD=$(git rev-parse --short HEAD)"
            git log -1 --oneline
            rm -rf deploy/webui-dist-staging
            mkdir -p deploy/webui-dist-staging

      # Do NOT set rm:true against deploy/ — that wipes compose, .env, and scripts.
      - name: Upload WebUI dist to ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.ECS_HOST }}
          username: ${{ env.ECS_USER }}
          key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          port: ${{ env.ECS_SSH_PORT }}
          source: "deploy/webui-dist-staging"
          target: "/opt/demo/minibot"
          strip_components: 0
          overwrite: true
          rm: false

      - name: Promote WebUI dist on ECS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.ECS_HOST }}
          username: ${{ env.ECS_USER }}
          key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          port: ${{ env.ECS_SSH_PORT }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/demo/minibot
            # Re-sync tracked files (keeps untracked staging/.env).
            git fetch origin "${{ github.sha }}"
            git reset --hard "${{ github.sha }}"
            test -f deploy/webui-dist-staging/index.html
            bash deploy/promote-webui.sh
            test -f deploy/webui-dist/index.html
            # If a prior rm+mv left the container on a deleted mount inode, remount.
            if ! curl -fsS -o /dev/null http://127.0.0.1:8766/; then
              echo "SPA 500/unreachable — restarting minibot to remount webui-dist"
              docker restart minibot
              for i in $(seq 1 30); do
                if curl -fsS http://127.0.0.1:8766/health >/dev/null; then
                  break
                fi
                sleep 2
              done
            fi
            curl -fsS -o /dev/null -w "local webui %{http_code}\n" http://127.0.0.1:8766/

      - name: Verify public bot + CDN asset URLs
        run: |
          set -euo pipefail
          version="${{ steps.cdn.outputs.version }}"
          html="$(curl -fsS https://bot.liuyidi.me/)"
          printf '%s' "$html" | grep -F "downloads.liuyidi.me/minibot/webui/${version}/"
          printf '%s' "$html" | grep -F 'webui/vendor/katex/'
          js="$(printf '%s' "$html" | grep -oE "https://downloads\\.liuyidi\\.me/minibot/webui/${version}/assets/index-[^\"[:space:]]+\\.js" | head -1)"
          test -n "$js"
          echo "checking $js"
          hdrs="$(curl -fsS -D - -o /dev/null -H 'Accept-Encoding: gzip' "$js")"
          printf '%s\n' "$hdrs" | tr -d '\r' | grep -qiE '^content-encoding:[[:space:]]*gzip'
          size="$(curl -fsS -o /dev/null -H 'Accept-Encoding: gzip' -w '%{size_download}' "$js")"
          echo "on-wire=${size}"
          test "$size" -lt 900000
          katex_css="$(printf '%s' "$html" | grep -oE 'https://downloads\.liuyidi\.me/minibot/webui/vendor/katex/[^"]+/katex\.min\.css' | head -1)"
          test -n "$katex_css"
          curl -fsS -o /dev/null -H 'Accept-Encoding: gzip' "$katex_css"
          syntax_base="${{ steps.syntax.outputs.vendor_base }}"
          test -n "$syntax_base"
          curl -fsS -o /dev/null -H 'Accept-Encoding: gzip' "${syntax_base}/syntax-highlight.js"
          # App JS must embed the vendor base (not ship local lang chunks).
          app_js="$(curl -fsS "$js")"
          printf '%s' "$app_js" | grep -F 'webui/vendor/syntax-highlight/'
          curl -fsS -o /dev/null -w "public bot %{http_code}\n" https://bot.liuyidi.me/

  notify-serverlessship:
    needs: publish-webui
    if: ${{ needs.publish-webui.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SERVERLESSSHIP_RELEASE_URL: ${{ vars.SERVERLESSSHIP_RELEASE_URL }}
      SERVERLESSSHIP_TOKEN: ${{ secrets.SERVERLESSSHIP_TOKEN_MINIBOT || secrets.SERVERLESSSHIP_TOKEN }}

    steps:
      - name: Send deploy notification to ServerlessShip
        run: |
          set -euo pipefail

          if [[ -z "${SERVERLESSSHIP_TOKEN:-}" ]]; then
            echo "Missing SERVERLESSSHIP_TOKEN_MINIBOT (or SERVERLESSSHIP_TOKEN) secret." >&2
            exit 1
          fi

          serverlessship_release_url="${SERVERLESSSHIP_RELEASE_URL:-https://serverless-ship.liuyidi.me/api/releases}"

          payload="$(node -e 'process.stdout.write(JSON.stringify({
            project: "minibot-webui",
            version: process.env.RELEASE_VERSION,
            tag: process.env.RELEASE_SHA,
            repository: process.env.GITHUB_REPOSITORY,
            releaseUrl: process.env.RELEASE_URL,
            workflowUrl: process.env.WORKFLOW_URL,
            channel: "WebUI",
          }));')"

          response="$(
            curl -fsS \
              -X POST \
              -H "Authorization: Bearer ${SERVERLESSSHIP_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "$serverlessship_release_url"
          )"

          echo "$response"
        env:
          RELEASE_VERSION: ${{ needs.publish-webui.outputs.short_sha }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_URL: https://bot.liuyidi.me/
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
