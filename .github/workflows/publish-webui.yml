name: Publish WebUI (ECS)

# Build the React WebUI on GitHub Actions, then promote dist on Aliyun ECS
# (served by minibot at bot.liuyidi.me via bind-mount). Does not rebuild the
# Python server image — use Publish Server (ECS) for that.
#
# Trigger: push to main touching webui/** (or promote script / this workflow),
# or Actions → Run workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "webui/**"
      - "deploy/promote-webui.sh"
      - ".github/workflows/publish-webui.yml"

concurrency:
  group: aliyun-ecs-demo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-webui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      ECS_HOST: ${{ vars.ECS_HOST || '116.62.35.76' }}
      ECS_USER: ${{ vars.ECS_USER || 'root' }}
      ECS_SSH_PORT: ${{ vars.ECS_SSH_PORT || 22 }}

    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}

    steps:
      - name: Resolve deploy metadata
        id: meta
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Build WebUI
        working-directory: webui
        env:
          VITE_MINIBOT_RELEASES_URL: https://downloads.liuyidi.me/minibot/releases.json
          VITE_PORTAL_DOWNLOAD: https://liuyidi.me/minibot/download/
        run: |
          npm ci
          npm run build
          test -f dist/index.html

      - name: Stage dist for upload
        run: |
          rm -rf deploy/webui-dist-staging
          mkdir -p deploy/webui-dist-staging
          cp -a webui/dist/. deploy/webui-dist-staging/

      - name: Pull minibot commit on ECS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.ECS_HOST }}
          username: ${{ env.ECS_USER }}
          key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          port: ${{ env.ECS_SSH_PORT }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            git config --global --add safe.directory /opt/demo/minibot
            cd /opt/demo/minibot
            git fetch origin "${{ github.sha }}"
            git reset --hard "${{ github.sha }}"
            echo "HEAD=$(git rev-parse --short HEAD)"
            git log -1 --oneline
            rm -rf deploy/webui-dist-staging
            mkdir -p deploy/webui-dist-staging

      - name: Upload WebUI dist to ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.ECS_HOST }}
          username: ${{ env.ECS_USER }}
          key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          port: ${{ env.ECS_SSH_PORT }}
          source: "deploy/webui-dist-staging"
          target: "/opt/demo/minibot/deploy"
          strip_components: 1
          overwrite: true
          rm: true

      - name: Promote WebUI dist on ECS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.ECS_HOST }}
          username: ${{ env.ECS_USER }}
          key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          port: ${{ env.ECS_SSH_PORT }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/demo/minibot
            bash deploy/promote-webui.sh
            test -f deploy/webui-dist/index.html
            # Bind-mount is live; no container rebuild needed.
            curl -fsS -o /dev/null -w "local webui %{http_code}\n" http://127.0.0.1:8766/

      - name: Verify public bot URL
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.ECS_HOST }}
          username: ${{ env.ECS_USER }}
          key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          port: ${{ env.ECS_SSH_PORT }}
          command_timeout: 2m
          script: |
            set -euo pipefail
            curl -fsS -o /dev/null -w "public bot %{http_code}\n" https://bot.liuyidi.me/

  notify-serverlessship:
    needs: publish-webui
    if: ${{ needs.publish-webui.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SERVERLESSSHIP_RELEASE_URL: ${{ vars.SERVERLESSSHIP_RELEASE_URL }}
      SERVERLESSSHIP_TOKEN: ${{ secrets.SERVERLESSSHIP_TOKEN_MINIBOT || secrets.SERVERLESSSHIP_TOKEN }}

    steps:
      - name: Send deploy notification to ServerlessShip
        run: |
          set -euo pipefail

          if [[ -z "${SERVERLESSSHIP_TOKEN:-}" ]]; then
            echo "Missing SERVERLESSSHIP_TOKEN_MINIBOT (or SERVERLESSSHIP_TOKEN) secret." >&2
            exit 1
          fi

          serverlessship_release_url="${SERVERLESSSHIP_RELEASE_URL:-https://serverless-ship.liuyidi.me/api/releases}"

          payload="$(node -e 'process.stdout.write(JSON.stringify({
            project: "minibot-webui",
            version: process.env.RELEASE_VERSION,
            tag: process.env.RELEASE_SHA,
            repository: process.env.GITHUB_REPOSITORY,
            releaseUrl: process.env.RELEASE_URL,
            workflowUrl: process.env.WORKFLOW_URL,
            channel: "WebUI",
          }));')"

          response="$(
            curl -fsS \
              -X POST \
              -H "Authorization: Bearer ${SERVERLESSSHIP_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "$serverlessship_release_url"
          )"

          echo "$response"
        env:
          RELEASE_VERSION: ${{ needs.publish-webui.outputs.short_sha }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_URL: https://bot.liuyidi.me/
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
