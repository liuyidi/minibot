name: Publish Server (ECS)

# Rebuild the Python minibot runtime image on Aliyun ECS (bot.liuyidi.me).
# WebUI is published separately by publish-webui.yml (host bind-mount).
# Public site (liuyidi.me) is published by publish-site.yml.
#
# Trigger: push to main touching minibot/** / Dockerfile, or Actions → Run workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "minibot/**"
      - "Dockerfile.minibot"
      - "deploy/docker-compose.yml"
      - "deploy/up.sh"
      - ".github/workflows/publish-server-ecs.yml"

concurrency:
  group: aliyun-ecs-demo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-server:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      ECS_HOST: ${{ vars.ECS_HOST || '116.62.35.76' }}
      ECS_USER: ${{ vars.ECS_USER || 'root' }}
      ECS_SSH_PORT: ${{ vars.ECS_SSH_PORT || 22 }}

    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}

    steps:
      - name: Resolve deploy metadata
        id: meta
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Pull minibot commit on ECS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.ECS_HOST }}
          username: ${{ env.ECS_USER }}
          key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          port: ${{ env.ECS_SSH_PORT }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            git config --global --add safe.directory /opt/demo/minibot
            cd /opt/demo/minibot
            git fetch origin "${{ github.sha }}"
            git reset --hard "${{ github.sha }}"
            echo "HEAD=$(git rev-parse --short HEAD)"
            git log -1 --oneline

      - name: Seed WebUI dist from running container if missing
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.ECS_HOST }}
          username: ${{ env.ECS_USER }}
          key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          port: ${{ env.ECS_SSH_PORT }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/demo/minibot
            if [[ -f deploy/webui-dist/index.html ]]; then
              echo "webui-dist already present"
              exit 0
            fi
            echo "Seeding deploy/webui-dist from container minibot (one-time migration)"
            rm -rf deploy/webui-dist-staging
            mkdir -p deploy/webui-dist-staging
            if docker cp minibot:/app/webui-dist/. deploy/webui-dist-staging/; then
              bash deploy/promote-webui.sh
            else
              echo "WARN: could not docker cp webui-dist; run Publish WebUI (ECS) before restart" >&2
              mkdir -p deploy/webui-dist
            fi

      - name: Build minibot server image on ECS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.ECS_HOST }}
          username: ${{ env.ECS_USER }}
          key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          port: ${{ env.ECS_SSH_PORT }}
          command_timeout: 35m
          script: |
            set -euo pipefail
            cd /opt/demo/minibot/deploy
            mkdir -p webui-dist
            export LANGFUSE_SDK_DIR=/opt/demo/mini-langfuse/sdk-python
            docker compose -f docker-compose.yml --env-file .env build minibot

      - name: Restart minibot container
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.ECS_HOST }}
          username: ${{ env.ECS_USER }}
          key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          port: ${{ env.ECS_SSH_PORT }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/demo/minibot/deploy
            mkdir -p webui-dist
            export LANGFUSE_SDK_DIR=/opt/demo/mini-langfuse/sdk-python
            docker compose -f docker-compose.yml --env-file .env up -d minibot
            docker ps --filter name=minibot --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'

      - name: Wait for minibot /health
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.ECS_HOST }}
          username: ${{ env.ECS_USER }}
          key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          port: ${{ env.ECS_SSH_PORT }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            ok=0
            for i in $(seq 1 40); do
              if curl -fsS --max-time 3 http://127.0.0.1:8766/health >/tmp/minibot-health.json; then
                echo "health ok after ${i} attempt(s): $(cat /tmp/minibot-health.json)"
                ok=1
                break
              fi
              echo "waiting for minibot health (${i}/40)..."
              sleep 3
            done
            if [[ "$ok" -ne 1 ]]; then
              echo "minibot health check failed; recent logs:"
              docker logs minibot --tail 120 || true
              exit 1
            fi

      - name: Verify WebUI and public URL
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.ECS_HOST }}
          username: ${{ env.ECS_USER }}
          key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          port: ${{ env.ECS_SSH_PORT }}
          command_timeout: 2m
          script: |
            set -euo pipefail
            test -f /opt/demo/minibot/deploy/webui-dist/index.html
            curl -fsS -o /dev/null -w "local webui %{http_code}\n" http://127.0.0.1:8766/
            curl -fsS -o /dev/null -w "public bot %{http_code}\n" https://bot.liuyidi.me/ || true

  notify-serverlessship:
    needs: publish-server
    if: ${{ needs.publish-server.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SERVERLESSSHIP_RELEASE_URL: ${{ vars.SERVERLESSSHIP_RELEASE_URL }}
      SERVERLESSSHIP_TOKEN: ${{ secrets.SERVERLESSSHIP_TOKEN_MINIBOT || secrets.SERVERLESSSHIP_TOKEN }}

    steps:
      - name: Send deploy notification to ServerlessShip
        run: |
          set -euo pipefail

          if [[ -z "${SERVERLESSSHIP_TOKEN:-}" ]]; then
            echo "Missing SERVERLESSSHIP_TOKEN_MINIBOT (or SERVERLESSSHIP_TOKEN) secret." >&2
            exit 1
          fi

          serverlessship_release_url="${SERVERLESSSHIP_RELEASE_URL:-https://serverless-ship.liuyidi.me/api/releases}"

          payload="$(node -e 'process.stdout.write(JSON.stringify({
            project: "minibot",
            version: process.env.RELEASE_VERSION,
            tag: process.env.RELEASE_SHA,
            repository: process.env.GITHUB_REPOSITORY,
            releaseUrl: process.env.RELEASE_URL,
            workflowUrl: process.env.WORKFLOW_URL,
            channel: "Server",
          }));')"

          response="$(
            curl -fsS \
              -X POST \
              -H "Authorization: Bearer ${SERVERLESSSHIP_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "$serverlessship_release_url"
          )"

          echo "$response"
        env:
          RELEASE_VERSION: ${{ needs.publish-server.outputs.short_sha }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_URL: https://bot.liuyidi.me/
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
