name: Cleanup OSS WebUI Legacy

# One-shot / occasional: delete unversioned minibot/webui/{assets,brand}/
# left by the first CDN publish. Keeps minibot/webui/<version>/.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List only (DRY_RUN=1)"
        type: boolean
        default: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      OSS_BUCKET: ${{ vars.OSS_BUCKET }}
      OSS_REGION: ${{ vars.OSS_REGION }}
      OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
      OSS_PUBLIC_BASE_URL: ${{ vars.OSS_PUBLIC_BASE_URL }}
      OSS_PREFIX: ${{ vars.OSS_PREFIX || 'minibot' }}
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check OSS credentials
        run: |
          missing=0
          for name in OSS_BUCKET OSS_REGION OSS_ENDPOINT OSS_ACCESS_KEY_ID OSS_ACCESS_KEY_SECRET; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret/variable: $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Install ossutil
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip
          curl -fsSL -o /tmp/ossutil.zip \
            "https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil-v1.7.19-linux-amd64.zip"
          unzip -qo /tmp/ossutil.zip -d /tmp/ossutil
          bin="$(find /tmp/ossutil -type f \( -name 'ossutil64' -o -name 'ossutil' \) | head -n1)"
          sudo install -m 755 "$bin" /usr/local/bin/ossutil
          ossutil config \
            -e "$OSS_ENDPOINT" \
            -i "$OSS_ACCESS_KEY_ID" \
            -k "$OSS_ACCESS_KEY_SECRET" \
            -L CH \
            --config-file "$HOME/.ossutilconfig"

      - name: Remove legacy unversioned webui assets
        run: |
          chmod +x scripts/cleanup-oss-webui-legacy.sh
          scripts/cleanup-oss-webui-legacy.sh
