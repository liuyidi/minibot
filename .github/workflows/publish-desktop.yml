name: Publish Desktop

# Builds minibot Tauri shell for macOS / Windows / Linux, publishes a GitHub
# Release, then lets the OSS sync workflow mirror the assets.
# Trigger: manual run or push tag v*.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            bundle_name: macos-aarch64
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            bundle_name: macos-x86_64
          - platform: ubuntu-22.04
            args: ""
            bundle_name: linux
          - platform: windows-latest
            args: ""
            bundle_name: windows

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Build and upload release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: v__VERSION__
          releaseName: minibot v__VERSION__
          releaseBody: |
            Desktop thin shell for minibot WebUI (macOS / Windows / Linux).

            Unsigned CI builds: macOS may need `xattr -dr com.apple.quarantine` after install;
            Windows SmartScreen may warn until code-signed.
          releaseDraft: false
          prerelease: false
          # No updater signing keys in CI yet — don't require .sig / updater JSON.
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          uploadWorkflowArtifacts: true
          args: ${{ matrix.args }}

  notify-serverlessship:
    needs: publish-tauri
    if: ${{ needs.publish-tauri.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SERVERLESSSHIP_RELEASE_URL: ${{ vars.SERVERLESSSHIP_RELEASE_URL }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Read release version
        id: release-version
        run: |
          version="$(node -p "require('./desktop/package.json').version")"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Send release notification to ServerlessShip
        run: |
          set -euo pipefail

          version="${RELEASE_VERSION}"
          serverlessship_release_url="${SERVERLESSSHIP_RELEASE_URL:-https://serverless-ship.liuyidi.me/api/releases}"

          payload="$(node -e 'const version = process.env.RELEASE_VERSION; process.stdout.write(JSON.stringify({ project: "minibot", version, tag: `v${version}`, repository: process.env.GITHUB_REPOSITORY, releaseUrl: process.env.RELEASE_URL, workflowUrl: process.env.WORKFLOW_URL, channel: "GitHub Release" }));')"

          response="$(
            curl -fsS \
              -X POST \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "$serverlessship_release_url"
          )"

          echo "$response"
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.value }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.release-version.outputs.value }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
