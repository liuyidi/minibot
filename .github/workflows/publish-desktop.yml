name: Publish Desktop

# Builds minibot Tauri shell for macOS / Windows / Linux, creates a GitHub draft
# release, then publishes it automatically so the OSS sync workflow can run.
# Trigger: push to main touching desktop/, push tag desktop-v*, or Actions → Run workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/publish-desktop.yml"
    tags:
      - "desktop-v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Build and upload release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: desktop-v__VERSION__
          releaseName: minibot desktop v__VERSION__
          releaseBody: |
            Desktop thin shell for minibot WebUI (macOS / Windows / Linux).

            Unsigned CI builds: macOS may need `xattr -dr com.apple.quarantine` after install;
            Windows SmartScreen may warn until code-signed.
          releaseDraft: true
          prerelease: true
          # No updater signing keys in CI yet — don't require .sig / updater JSON.
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          args: ${{ matrix.args }}

  notify-feishu:
    needs: publish-tauri
    if: ${{ needs.publish-tauri.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      FEISHU_RELEASE_WEBHOOK_URL: ${{ secrets.FEISHU_RELEASE_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Send Feishu release notification
        run: |
          set -euo pipefail

          if [[ -z "${FEISHU_RELEASE_WEBHOOK_URL:-}" ]]; then
            echo "FEISHU_RELEASE_WEBHOOK_URL is not set; skipping Feishu notification."
            exit 0
          fi

          chmod +x scripts/send-feishu-release-notification.sh

          version="$(node -p "require('./desktop/package.json').version")"
          release_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/desktop-v${version}"
          workflow_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          FEISHU_RELEASE_TITLE="minibot desktop 发布完成" \
          FEISHU_RELEASE_PHASE="GitHub Release 已创建" \
          FEISHU_RELEASE_SUBTITLE="v${version} · GitHub Release" \
          FEISHU_RELEASE_SUMMARY="GitHub Release 已创建，桌面安装包已发布。" \
          FEISHU_CARD_TEMPLATE="green" \
          RELEASE_VERSION="$version" \
          RELEASE_URL="$release_url" \
          WORKFLOW_URL="$workflow_url" \
          scripts/send-feishu-release-notification.sh

  publish-release:
    needs: publish-tauri
    if: ${{ needs.publish-tauri.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Publish draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          version="$(node -p "require('./desktop/package.json').version")"
          tag="desktop-v${version}"

          draft="$(gh release view "$tag" --json draft --jq '.draft' 2>/dev/null || echo "false")"
          if [[ "$draft" != "true" ]]; then
            echo "Release $tag is already published; nothing to do."
            exit 0
          fi

          gh release edit "$tag" --draft=false --repo "$GITHUB_REPOSITORY"
