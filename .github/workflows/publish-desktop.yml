name: Publish Desktop

# Default desktop publisher: desktop/ + frozen minibot sidecar (PyInstaller onedir).
# Trigger: unified Release tag v*, or manual workflow_dispatch.
# GitHub Release tag stays desktop-v2-v<version> so it does not collide with
# the orchestration tag v* (client package).

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is arm64; macos-13 is retired — use macos-15-intel for x86_64.
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            triple: aarch64-apple-darwin
          - platform: macos-15-intel
            args: --target x86_64-apple-darwin
            triple: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            triple: x86_64-unknown-linux-gnu
          - platform: windows-latest
            args: ""
            triple: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    # Windows defaults to pwsh; .sh freeze/prepare must run under Git Bash or they
    # can "succeed" without executing (then Tauri fails: resources/minibot-sidecar missing).
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            webui/package-lock.json
            desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || matrix.platform == 'macos-15-intel' && 'x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Setup uv / Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Sync minibot dependencies
        working-directory: minibot
        run: uv sync --extra feishu --extra weixin

      - name: Build WebUI dist
        working-directory: webui
        run: |
          npm ci
          npm run build
          test -f dist/index.html

      - name: Freeze minibot sidecar
        run: ./scripts/freeze-minibot-sidecar.sh ${{ matrix.triple }}

      - name: Prepare sidecar for Tauri
        run: |
          set -euo pipefail
          ./desktop/scripts/prepare-sidecar.sh ${{ matrix.triple }}
          dest="desktop/src-tauri/resources/minibot-sidecar"
          ls -la "$dest"
          if [[ -f "$dest/minibot-sidecar.exe" || -f "$dest/minibot-sidecar" ]]; then
            echo "prepare-sidecar: launcher present"
          else
            echo "prepare-sidecar: missing launcher under $dest" >&2
            exit 1
          fi

      - name: Install desktop frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Build and upload release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: desktop-v2-v__VERSION__
          releaseName: minibot Desktop V2 v__VERSION__
          releaseBody: |
            Desktop app with a local minibot gateway (frozen sidecar).

            Unsigned CI builds use macOS ad-hoc signing. If Gatekeeper says the app is
            “damaged”: `xattr -cr "/Applications/minibot V2.app"` then
            `codesign --force --deep --sign - "/Applications/minibot V2.app"`.
            Windows SmartScreen may warn until Developer ID signed.

            Installers are mirrored to OSS (`downloads.liuyidi.me/minibot/releases.json`).
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          uploadWorkflowArtifacts: true
          args: ${{ matrix.args }}

  notify-serverlessship:
    needs: publish-tauri
    if: ${{ needs.publish-tauri.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SERVERLESSSHIP_RELEASE_URL: ${{ vars.SERVERLESSSHIP_RELEASE_URL }}
      SERVERLESSSHIP_TOKEN: ${{ secrets.SERVERLESSSHIP_TOKEN_MINIBOT || secrets.SERVERLESSSHIP_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Read release version
        id: release-version
        run: |
          version="$(node -p "require('./desktop/package.json').version")"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Send release notification to ServerlessShip
        run: |
          set -euo pipefail

          if [[ -z "${SERVERLESSSHIP_TOKEN:-}" ]]; then
            echo "Missing SERVERLESSSHIP_TOKEN_MINIBOT (or SERVERLESSSHIP_TOKEN) secret." >&2
            exit 1
          fi

          serverlessship_release_url="${SERVERLESSSHIP_RELEASE_URL:-https://serverless-ship.liuyidi.me/api/releases}"

          payload="$(node -e 'const version = process.env.RELEASE_VERSION; const tag = process.env.RELEASE_TAG; process.stdout.write(JSON.stringify({ project: "minibot", version, tag, repository: process.env.GITHUB_REPOSITORY, releaseUrl: process.env.RELEASE_URL, workflowUrl: process.env.WORKFLOW_URL, channel: "GitHub Release (Desktop)" }));')"

          response="$(
            curl -fsS \
              -X POST \
              -H "Authorization: Bearer ${SERVERLESSSHIP_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "$serverlessship_release_url"
          )"

          echo "$response"
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.value }}
          RELEASE_TAG: desktop-v2-v${{ steps.release-version.outputs.value }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/desktop-v2-v${{ steps.release-version.outputs.value }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
